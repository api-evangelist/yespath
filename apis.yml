name: YesPath
description: >-
  YesPath was an account engagement platform based in San Francisco that helped B2B sales
  and marketing teams reach and win large target accounts, using machine learning to surface
  real-time recommendations on the right content and next best action for each account. The
  company was acquired by Medium in April 2017 and no longer operates as an independent product;
  the yespath.com domain still resolves to AWS IP addresses but serves no live web application.
  This profile was surfaced as a portfolio company of Bloomberg Beta and added to the API
  Evangelist network as a stub. Enrichment found no live developer, API, or documentation
  surface to harvest — the entry is retained for portfolio-graph completeness.
